name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from project.godot
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^config/version="?[^"]+' project.godot | sed -E 's/.*config\/version="?([^"]+).*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Could not find config/version in project.godot"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "project.godot version: $VERSION"
          echo "Git tag version:       $TAG_VERSION"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: project.godot version does not match Git tag."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: "4.7.1"
          mono: true
          export-templates: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      # The .godot directory is generated data and must never be relied on
      # from a previous machine/run.
      - name: Clean Godot generated data
        run: |
          rm -rf .godot

      - name: Restore .NET dependencies
        run: |
          dotnet restore

      - name: Build C# project
        run: |
          dotnet build "Sandboxnator Reinassance Godot.csproj" \
            --configuration Release \
            --no-restore

      # Force Godot to perform its filesystem/resource import pass.
      - name: Import Godot project
        shell: bash
        run: |
          godot --headless \
            --path . \
            --editor \
            --quit

      # The editor can return before every generated import artifact is ready.
      # Wait until representative generated resources exist before exporting.
      - name: Wait for Godot imports
        shell: bash
        run: |
          echo "Waiting for Godot resource imports..."

          REQUIRED_FILES=(
            ".godot/imported/knob16_capsule.png-ab3df30e535eeb73fe53a90310bd8879.ctex"
            ".godot/imported/Inter-VariableFont_opsz,wght.ttf-6910359199db2dee3344d081a289f7d3.fontdata"
          )

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ALL_READY=true

            for FILE in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$FILE" ]; then
                echo "Waiting for: $FILE"
                ALL_READY=false
              fi
            done

            if [ "$ALL_READY" = true ]; then
              echo "Required Godot imports are ready."
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          echo "ERROR: Godot imports did not finish in time."
          echo
          echo "Contents of .godot/imported:"
          find .godot/imported -maxdepth 1 -type f | sort | head -100 || true
          exit 1

      - name: Verify critical assets
        shell: bash
        run: |
          REQUIRED_ASSETS=(
            "Assets/Font/Inter-VariableFont_opsz,wght.ttf"
            "UI/Theme/UI_Textures/knob16_capsule.png"
            "_ThirdParty/addons/input_helper/assets/update.svg"
          )

          for FILE in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing source asset: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

      - name: Build Linux
        run: |
          mkdir -p builds/linux

          godot --headless \
            --path . \
            --export-release "Linux" \
            "builds/linux/SandboxnatorLinux_${{ steps.version.outputs.version }}.x86_64"

      - name: Build Windows
        run: |
          mkdir -p builds/windows

          godot --headless \
            --path . \
            --export-release "Windows Desktop" \
            "builds/windows/SandboxnatorWin64_${{ steps.version.outputs.version }}.exe"

      - name: Verify Linux build
        run: |
          test -f "builds/linux/SandboxnatorLinux_${{ steps.version.outputs.version }}.x86_64"

      - name: Verify Windows build
        run: |
          test -f "builds/windows/SandboxnatorWin64_${{ steps.version.outputs.version }}.exe"

      - name: Zip Linux build
        run: |
          cd builds/linux
          zip -r "../../SandboxnatorLinux_${{ steps.version.outputs.version }}.zip" .

      - name: Zip Windows build
        run: |
          cd builds/windows
          zip -r "../../SandboxnatorWin64_${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sandboxnator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SandboxnatorLinux_${{ steps.version.outputs.version }}.zip
            SandboxnatorWin64_${{ steps.version.outputs.version }}.zip
