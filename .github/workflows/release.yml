name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from project.godot
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^config/version="?[^"]+' project.godot | sed -E 's/.*config\/version="?([^"]+).*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Could not find config/version in project.godot"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "project.godot version: $VERSION"
          echo "Git tag version:       $TAG_VERSION"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: project.godot version does not match Git tag."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: "4.7.1"
          mono: true
          export-templates: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build Linux
        run: |
          mkdir -p builds/linux

          godot --headless \
            --path . \
            --export-release "Linux" \
            "builds/linux/SandboxnatorLinux_${{ steps.version.outputs.version }}.x86_64"

      - name: Build Windows
        run: |
          mkdir -p builds/windows

          godot --headless \
            --path . \
            --export-release "Windows Desktop" \
            "builds/windows/SandboxnatorWin64_${{ steps.version.outputs.version }}.exe"

      - name: Zip Linux build
        run: |
          cd builds/linux
          zip -r "../../SandboxnatorLinux_${{ steps.version.outputs.version }}.zip" .

      - name: Zip Windows build
        run: |
          cd builds/windows
          zip -r "../../SandboxnatorWin64_${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sandboxnator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SandboxnatorLinux_${{ steps.version.outputs.version }}.zip
            SandboxnatorWin64_${{ steps.version.outputs.version }}.zip